    <link rel="stylesheet" th:href="@{/css/main.css}">

<body>

<!-- HTMX -->
<script src="https://unpkg.com/htmx.org@2.0.4"

<!-- KaTeX JS + auto-render -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"
        crossorigin="anonymous"></script>

<script>
    const KATEX_OPTIONS = {
        delimiters: [
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false
    };

    // Render inicial de la página completa
    renderMathInElement(document.body, KATEX_OPTIONS);

    // Re-render tras cada intercambio de fragmento HTMX
    document.body.addEventListener('htmx:afterSwap', function (e) {
        renderMathInElement(e.detail.target, KATEX_OPTIONS);
    });
</script>
