<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ═══════════════════════════════════════════════════════════
     FRAGMENTO: tarjeta
     ═══════════════════════════════════════════════════════════ -->
<div id="tarjeta" th:fragment="tarjeta" class="card">

    <div class="card-header">
        <div class="card-meta">
            <span class="badge badge-curso">2º Bach. &middot; BL2</span>

            <!-- Superposición electrostática -->
            <span th:if="${ejercicio.electromagnetismType.name() == 'ELECTROSTATIC_SUPERPOSITION'
                          and ejercicio.unknownVariable == 'potencial_V'}"
                  class="badge badge-grafica">Potencial V</span>
            <span th:if="${ejercicio.electromagnetismType.name() == 'ELECTROSTATIC_SUPERPOSITION'
                          and ejercicio.unknownVariable == 'campo_E'}"
                  class="badge badge-grafica">Campo |E|</span>

            <!-- Fuerza de Lorentz -->
            <span th:if="${ejercicio.electromagnetismType.name() == 'LORENTZ_MOTION'
                          and ejercicio.unknownVariable == 'radio_r'}"
                  class="badge badge-vector">Radio orbital</span>
            <span th:if="${ejercicio.electromagnetismType.name() == 'LORENTZ_MOTION'
                          and ejercicio.unknownVariable == 'velocidad_v'}"
                  class="badge badge-vector">Velocidad</span>
            <span th:if="${ejercicio.electromagnetismType.name() == 'LORENTZ_MOTION'
                          and ejercicio.unknownVariable == 'frecuencia_f'}"
                  class="badge badge-vector">Frec. ciclotrón</span>

            <!-- Inducción de Faraday -->
            <span th:if="${ejercicio.electromagnetismType.name() == 'FARADAY_INDUCTION'
                          and ejercicio.unknownVariable == 'flujo_max'}"
                  class="badge badge-error">Flujo &Phi;</span>
            <span th:if="${ejercicio.electromagnetismType.name() == 'FARADAY_INDUCTION'
                          and ejercicio.unknownVariable == 'fem_max'}"
                  class="badge badge-error">FEM inducida</span>
        </div>

        <button class="btn btn-ghost"
                hx-get="/2bach/bl2/ejercicio"
                hx-target="#tarjeta"
                hx-swap="outerHTML">
            Siguiente &#8594;
        </button>
    </div>

    <div class="statement-area">
        <p class="statement" th:text="${ejercicio.statement}">Enunciado.</p>
    </div>

    <div id="form-area" class="form-area">
        <form th:attr="hx-post=@{/2bach/bl2/ejercicio/{id}/comprobar(id=${ejercicio.id})}"
              hx-target="#form-area"
              hx-swap="innerHTML"
              class="answer-form">
            <div class="input-group">
                <input type="text" name="respuesta" class="answer-input"
                       placeholder="p.ej. 1.14e-4 ó -5.40e4"
                       autocomplete="off" required>
                <span class="answer-unit"
                      th:if="${ejercicio.answerUnit != null and !ejercicio.answerUnit.isEmpty()}"
                      th:text="${ejercicio.answerUnit}">unidad</span>
                <button type="submit" class="btn btn-primary">Validar</button>
            </div>
            <p class="hint">
                Usa notación científica simplificada: <strong>1.14e-4</strong> ó <strong>-5.40e4</strong>.
                Puedes usar coma como decimal. Tolerancia: &#177;2&nbsp;%.
            </p>
            <div class="htmx-indicator spinner">Comprobando&hellip;</div>
        </form>
    </div>

</div><!-- #tarjeta -->


<!-- ═══════════════════════════════════════════════════════════
     FRAGMENTO: resultado
     ═══════════════════════════════════════════════════════════ -->
<div th:fragment="resultado">

    <div th:class="${correcto} ? 'resultado resultado-correcto' : 'resultado resultado-incorrecto'">

        <div class="verdict">
            <span class="verdict-icon" th:text="${correcto} ? '✓' : '✗'">✓</span>
            <strong class="verdict-text"
                    th:text="${correcto} ? '¡Correcto!' : 'Incorrecto'">!</strong>
        </div>

        <div class="correct-answer" th:unless="${correcto}">
            <span>Respuesta correcta:&nbsp;</span>
            <strong th:utext="${ejercicio.correctAnswerDisplay}">respuesta</strong>
        </div>

        <details class="explanation-details" open>
            <summary class="explanation-title"
                     th:text="${ejercicio.electromagnetismType.name() == 'ELECTROSTATIC_SUPERPOSITION'} ?
                         'Resolución: superposición de campo y potencial eléctrico' :
                         (${ejercicio.electromagnetismType.name() == 'LORENTZ_MOTION'} ?
                             'Resolución: equilibrio fuerza magnética — fuerza centrípeta' :
                             'Resolución: ley de Faraday-Lenz y flujo magnético')">
                Resolución
            </summary>
            <div class="explanation explanation--prose"
                 th:utext="${ejercicio.explanation}">explicación</div>
        </details>

    </div>

    <div class="next-area">
        <button class="btn btn-primary"
                hx-get="/2bach/bl2/ejercicio"
                hx-target="#tarjeta"
                hx-swap="outerHTML">
            Siguiente ejercicio &#8594;
        </button>
    </div>

</div><!-- resultado -->

</body>
</html>
