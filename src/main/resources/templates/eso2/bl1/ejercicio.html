<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ═══════════════════════════════════════════════════════════
     FRAGMENTO: tarjeta
     Devuelto por:  GET /eso2/bl1/ejercicio  (completo)
                    GET /              via th:replace en index.html
     Intercambiado: hx-swap="outerHTML" sobre #tarjeta
     ═══════════════════════════════════════════════════════════ -->
<div id="tarjeta" th:fragment="tarjeta" class="card">

    <!-- Cabecera: tipo de ejercicio + botón Siguiente -->
    <div class="card-header">
        <div class="card-meta">
            <span class="badge badge-curso">2º ESO · BL1</span>
            <span th:if="${ejercicio.exerciseType.name() == 'UNIT_CONVERSION'}"
                  class="badge badge-conversion">Conversión de unidades</span>
            <span th:unless="${ejercicio.exerciseType.name() == 'UNIT_CONVERSION'}"
                  class="badge badge-notacion">Notación científica</span>
        </div>
        <button class="btn btn-ghost"
                hx-get="/eso2/bl1/ejercicio"
                hx-target="#tarjeta"
                hx-swap="outerHTML">
            Siguiente &#8594;
        </button>
    </div>

    <!-- Enunciado -->
    <div class="statement-area">
        <p class="statement" th:text="${ejercicio.statement}">Enunciado del ejercicio.</p>
    </div>

    <!-- Área de formulario / resultado (HTMX intercambia su innerHTML) -->
    <div id="form-area" class="form-area">
        <form th:attr="hx-post=@{/eso2/bl1/ejercicio/{id}/comprobar(id=${ejercicio.id})}"
              hx-target="#form-area"
              hx-swap="innerHTML"
              class="answer-form">
            <div class="input-group">
                <input type="text"
                       name="respuesta"
                       class="answer-input"
                       placeholder="Escribe tu respuesta aquí…"
                       autocomplete="off"
                       autofocus
                       required>
                <button type="submit" class="btn btn-primary">
                    Validar
                </button>
            </div>
            <p class="hint">
                Usa coma (,) o punto (.) como separador decimal.
                Notación científica: <code>1,25×10^5</code>
            </p>
            <div class="htmx-indicator spinner">Comprobando…</div>
        </form>
    </div>

</div><!-- #tarjeta -->


<!-- ═══════════════════════════════════════════════════════════
     FRAGMENTO: resultado
     Devuelto por:  POST /eso2/bl1/ejercicio/{id}/comprobar
     Intercambiado: hx-swap="innerHTML" sobre #form-area
     Variables de modelo: correcto (boolean), ejercicio
     ═══════════════════════════════════════════════════════════ -->
<div th:fragment="resultado">

    <!-- Veredicto -->
    <div th:class="${correcto} ? 'resultado resultado-correcto' : 'resultado resultado-incorrecto'">
        <div class="verdict">
            <span class="verdict-icon" th:text="${correcto} ? '✓' : '✗'">✓</span>
            <strong class="verdict-text"
                    th:text="${correcto} ? '¡Correcto!' : 'Incorrecto'">!</strong>
        </div>

        <!-- Respuesta correcta solo cuando falla -->
        <div class="correct-answer" th:unless="${correcto}">
            <span>Respuesta correcta:&nbsp;</span>
            <strong th:utext="${ejercicio.correctAnswerDisplay}">respuesta</strong>
        </div>

        <!-- Explicación paso a paso (KaTeX renderiza \[...\] y \(...\)) -->
        <details class="explanation-details" open>
            <summary class="explanation-title">Resolución paso a paso</summary>
            <div class="explanation" th:utext="${ejercicio.explanation}">explicación</div>
        </details>
    </div>

    <!-- Botón Siguiente ejercicio -->
    <div class="next-area">
        <button class="btn btn-primary"
                hx-get="/eso2/bl1/ejercicio"
                hx-target="#tarjeta"
                hx-swap="outerHTML">
            Siguiente ejercicio &#8594;
        </button>
    </div>

</div><!-- resultado -->

</body>
</html>
