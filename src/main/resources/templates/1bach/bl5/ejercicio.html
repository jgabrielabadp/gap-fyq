<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ═══════════════════════════════════════════════════════════
     FRAGMENTO: tarjeta
     ═══════════════════════════════════════════════════════════ -->
<div id="tarjeta" th:fragment="tarjeta" class="card">

    <div class="card-header">
        <div class="card-meta">
            <span class="badge badge-curso">1º Bach. &middot; BL5</span>

            <span th:if="${ejercicio.organicChemistryType.name() == 'ORGANIC_NOMENCLATURE'}"
                  class="badge badge-conversion">Nomenclatura</span>

            <span th:if="${ejercicio.organicChemistryType.name() == 'STRUCTURAL_ISOMERISM'}"
                  class="badge badge-vector">Isomería</span>

            <span th:if="${ejercicio.organicChemistryType.name() == 'CARBON_ALLOTROPES'}"
                  class="badge badge-grafica">Alótropos</span>
        </div>

        <button class="btn btn-ghost"
                hx-get="/1bach/bl5/ejercicio"
                hx-target="#tarjeta"
                hx-swap="outerHTML">
            Siguiente &#8594;
        </button>
    </div>

    <div class="statement-area">
        <p class="statement" th:text="${ejercicio.statement}">Enunciado.</p>
    </div>

    <div id="form-area" class="form-area">
        <form th:attr="hx-post=@{/1bach/bl5/ejercicio/{id}/comprobar(id=${ejercicio.id})}"
              hx-target="#form-area"
              hx-swap="innerHTML"
              class="answer-form">

            <div class="mc-options">
                <label class="mc-label" th:each="opt,i : ${ejercicio.options}">
                    <input type="radio" name="respuesta"
                           th:value="${i.index}" required>
                    <span th:text="${opt}">opción</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top:0.75rem;">
                Validar
            </button>
            <div class="htmx-indicator spinner">Comprobando…</div>
        </form>
    </div>

</div><!-- #tarjeta -->


<!-- ═══════════════════════════════════════════════════════════
     FRAGMENTO: resultado
     ═══════════════════════════════════════════════════════════ -->
<div th:fragment="resultado">

    <div th:class="${correcto} ? 'resultado resultado-correcto' : 'resultado resultado-incorrecto'">

        <div class="verdict">
            <span class="verdict-icon" th:text="${correcto} ? '✓' : '✗'">✓</span>
            <strong class="verdict-text"
                    th:text="${correcto} ? '¡Correcto!' : 'Incorrecto'">!</strong>
        </div>

        <div class="correct-answer" th:unless="${correcto}">
            <span>Respuesta correcta:&nbsp;</span>
            <strong th:text="${ejercicio.correctAnswerDisplay}">respuesta</strong>
        </div>

        <details class="explanation-details" open>
            <summary class="explanation-title"
                     th:text="${ejercicio.organicChemistryType.name() == 'ORGANIC_NOMENCLATURE'} ?
                         'Análisis de la cadena principal y grupos funcionales' :
                         (${ejercicio.organicChemistryType.name() == 'STRUCTURAL_ISOMERISM'} ?
                             'Clasificación del tipo de isomería estructural' :
                             'Propiedades y estructura del alótropo del carbono')">
                Resolución
            </summary>
            <div class="explanation explanation--prose"
                 th:utext="${ejercicio.explanation}">explicación</div>
        </details>

    </div>

    <div class="next-area">
        <button class="btn btn-primary"
                hx-get="/1bach/bl5/ejercicio"
                hx-target="#tarjeta"
                hx-swap="outerHTML">
            Siguiente ejercicio &#8594;
        </button>
    </div>

</div><!-- resultado -->

</body>
</html>
