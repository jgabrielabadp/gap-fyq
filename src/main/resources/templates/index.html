<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/chrome :: head('Inicio')}"></head>
<body>

<header class="page-header">
    <div class="page-header-inner">
        <h1 class="page-title">GAP &mdash; Física y Química</h1>
        <p class="page-subtitle">Selecciona un curso para comenzar</p>
    </div>
</header>

<main class="page-main">
    <div class="course-grid">
        <a href="/eso2" class="course-card course-card--active">
            <span class="course-label">2º ESO</span>
            <span class="course-desc">Física y Química</span>
        </a>
        <a href="/eso3" class="course-card course-card--active">
            <span class="course-label">3º ESO</span>
            <span class="course-desc">Física y Química</span>
        </a>
        <div class="course-card course-card--disabled">
            <span class="course-label">4º ESO</span>
            <span class="course-badge-soon">Próximamente</span>
        </div>
        <div class="course-card course-card--disabled">
            <span class="course-label">1º Bach.</span>
            <span class="course-badge-soon">Próximamente</span>
        </div>
        <div class="course-card course-card--disabled">
            <span class="course-label">2º Bach.</span>
            <span class="course-badge-soon">Próximamente</span>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/chrome :: scripts}"></th:block>
</body>
</html>
