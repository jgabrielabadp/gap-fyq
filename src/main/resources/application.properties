spring.application.name=gap-fyq
server.port=8090

# H2 - base de datos en memoria para desarrollo local
spring.datasource.url=jdbc:h2:mem:fyqdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consola H2 (solo desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.gap.fyq=DEBUG
logging.level.org.springframework.web=INFO
